version: "2"
linters:
  default: none
  enable:
    - errcheck
    - godot
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - SA*
        - S1*
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - lll
        path: _test.go
formatters:
  enable:
    - gofmt
