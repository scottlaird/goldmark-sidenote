on: [push, pull_request]
name: test
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.22.x, 1.23.x, 1.24.x]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run lints
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
    - name: Run tests
      run: go test -race ./...
